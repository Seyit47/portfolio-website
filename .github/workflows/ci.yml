name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: http://localhost:3100
      CONTACT_IP_SALT: ci-salt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Google Chrome stable: used by Playwright (channel "chrome", matching local snapshots) and Lighthouse CI.
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm check:resume
      - run: pnpm e2e
        env:
          PW_SKIP_BUILD: "1"
          CI: "true"
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
